services:
  postgres:
    image: postgres:16-alpine
    container_name: qqs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qqs
      POSTGRES_USER: qqs
      POSTGRES_PASSWORD: qqs_dev_password
    ports:
      - "5432:5432"
    volumes:
      - qqs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qqs -d qqs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qqs_postgres_data:
